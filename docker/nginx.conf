user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 64M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Frontend (React SPA)
        root /var/www/frontend;
        index index.html;

        # Laravel storage files (uploads, product images)
        location ^~ /storage/ {
            alias /var/www/backend/storage/app/public/;
            try_files $uri =404;
            access_log off;
            expires 30d;
        }

        # Laravel API
        location ^~ /api {
            root /var/www/backend/public;
            try_files $uri $uri/ /index.php?$query_string;

            location ~ \.php$ {
                include fastcgi_params;
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
                fastcgi_param SCRIPT_NAME /index.php;
                fastcgi_buffers 16 16k;
                fastcgi_buffer_size 32k;
            }
        }

        # Direct PHP files handling
        location ~ \.php$ {
            root /var/www/backend/public;
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
        }

        # Frontend SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
